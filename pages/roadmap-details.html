<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Roadmap | CareerPath</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/roadmap-details.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-root="../" data-page="Roadmaps">

    <div id="navbar"></div>

    <main>

        <!-- HERO -->
        <section class="roadmap-hero">
            <div class="container">

                <a href="roadmap.html" class="back-link">
                    ← Back to Roadmaps
                </a>

                <div class="role-hero-content">

                    <div class="role-icon" id="roleIcon">
                        📊
                    </div>

                    <div>
                        <p class="eyebrow">YOUR LEARNING PATH</p>

                        <h1 id="roleTitle">
                            Data Analyst Roadmap
                        </h1>

                        <p id="roleDescription">
                            Follow the roadmap step by step and track your progress.
                        </p>
                    </div>

                </div>

                <!-- PROGRESS -->
                <div class="progress-card">

                    <div class="progress-top">
                        <span>Your Progress</span>

                        <strong>
                            <span id="progressPercent">0</span>%
                        </strong>
                    </div>

                    <div class="progress-track">
                        <div id="progressBar" class="progress-fill"></div>
                    </div>

                    <p id="progressText">
                        Start learning your roadmap 🚀
                    </p>

                </div>

            </div>
        </section>


        <!-- ROADMAP -->
        <section class="roadmap-section">

            <div class="container">

                <div class="section-heading">
                    <p class="eyebrow">STEP-BY-STEP PATH</p>

                    <h2>Master the skills in this order</h2>

                    <p>
                        Complete each stage before moving to the next one.
                    </p>
                </div>

                <div id="roadmapContainer" class="roadmap-flow">
                    <!-- JavaScript will generate roadmap -->
                </div>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script src="../js/main.js"></script>
    <script src="../js/roadmap.js"></script>

</body>

</html>
